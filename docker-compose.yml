version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: miso_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: miso_sweet_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  redis_cache:
    image: redis:latest
    container_name: miso_redis
    restart: always
    ports:
      - "6379:6379"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: miso_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql_db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql_db

volumes:
  db_data: